{% extends "admin/base.html" %}

{% block extrahead %}
{{ block.super }}
<style>
    /* 1. Esconde o botão 'Dashboard' com ícone na barra lateral */
    #jazzy-navigation > li.nav-item:first-child,
    #jazzy-navigation > li.nav-header {
        display: none !important;
    }

    /* 2. Oculta a tabela nativa repetida e ações recentes na Home */
    #content-main .card table,
    .col-md-3, .col-lg-3, #content-related, .timeline {
        display: none !important;
    }

    /* 3. Estilo do Card de Boas-Vindas */
    .welcome-card {
        background: #ffffff;
        border-radius: 8px;
        padding: 25px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        border-left: 5px solid #28a745;
        margin-bottom: 20px;
    }
    .welcome-card h3 {
        color: #2c3e50;
        font-weight: 600;
        margin-bottom: 8px;
    }
    .welcome-card p {
        color: #6c757d;
        font-size: 1rem;
        margin: 0;
    }
</style>
{% endblock %}

{% block content %}
<div class="welcome-card">
    <h3>🌱 Painel de Gestão — Bonsai Garden</h3>
    <p>Selecione uma das opções no menu lateral para gerenciar os <strong>Produtos, Categorias, Pedidos ou Banners</strong> do sistema.</p>
</div>
{% endblock %}
